<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Seat View — Three.js 3D Cinema Auditorium</title>
  <script>
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      var el = document.getElementById('loading-indicator');
      if (el) el.innerHTML = 'JS ERROR: ' + msg + ' (line ' + lineNo + ')';
      if (window.FlutterBridge && window.FlutterBridge.postMessage) {
        window.FlutterBridge.postMessage(JSON.stringify({ type: 'jsError', message: msg, line: lineNo }));
      }
      return false;
    };
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0a0c;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }
    #loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #4ade80;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="loading-indicator">INITIALIZING 3D AUDITORIUM...</div>

  <script src="three.min.js"></script>
  <script src="cinema_dimensions.js"></script>
  <script src="cinema_scene.js"></script>
</body>
</html>
